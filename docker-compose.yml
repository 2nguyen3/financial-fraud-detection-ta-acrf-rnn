services:
  db_node_1:
    image: postgres:16
    container_name: db_node_1
    restart: always
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_db
    ports:
      - "5433:5432"
    volumes:
      - db_node_1_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/data
    networks:
      - fraud_network

  db_node_2:
    image: postgres:16
    container_name: db_node_2
    restart: always
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_db
    ports:
      - "5434:5432"
    volumes:
      - db_node_2_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data:/data
    networks:
      - fraud_network

  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: nebula-metad
    restart: always
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
    ports:
      - "9559:9559"
      - "19559:19559"
    volumes:
      - nebula_meta_data:/data/meta
    networks:
      - fraud_network

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: nebula-storaged
    restart: always
    depends_on:
      - nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
    ports:
      - "9779:9779"
      - "19779:19779"
    volumes:
      - nebula_storage_data:/data/storage
    networks:
      - fraud_network

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: nebula-graphd
    restart: always
    depends_on:
      - nebula-metad
      - nebula-storaged
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --port=9669
      - --ws_ip=nebula-graphd
      - --ws_http_port=19669
    ports:
      - "9669:9669"
      - "19669:19669"
    networks:
      - fraud_network

  nebula-console:
    image: vesoft/nebula-console:v3.8.0
    container_name: nebula-console
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - nebula-graphd
    networks:
      - fraud_network

volumes:
  db_node_1_data:
  db_node_2_data:
  nebula_meta_data:
  nebula_storage_data:

networks:
  fraud_network:
    driver: bridge
